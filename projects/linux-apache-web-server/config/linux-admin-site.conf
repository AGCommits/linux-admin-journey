# Linux Admin Journey Apache virtual host
#
# Deployed to:
# /etc/httpd/conf.d/linux-admin-site.conf

<VirtualHost *:80>
    ServerName linux-admin.local
    ServerAdmin webmaster@localhost

    DocumentRoot "/var/www/linux-admin-site"

    <Directory "/var/www/linux-admin-site">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    DirectoryIndex index.html

    ErrorLog "/var/log/httpd/linux-admin-site-error.log"
    CustomLog "/var/log/httpd/linux-admin-site-access.log" combined

    ServerSignature Off
</VirtualHost>